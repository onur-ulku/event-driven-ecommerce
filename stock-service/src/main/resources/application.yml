server:
  port: 8082

spring:
  application:
    name: stock-service


  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Hangi package'daki sınıfları deserialize etmeye izin veriyoruz
        spring.json.trusted.packages: "com.ecommerce.common.event"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        spring.json.add.type.headers: true
        enable.idempotence: true
        
  datasource:
    # url: jdbc:h2:mem:stockdb  # in-memory: uygulama kapanınca her şey silinir
    url: jdbc:h2:file:./data/stockdb;AUTO_SERVER=TRUE  # file: diske yazar, uygulama kapansa bile veriler kalır
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # ddl-auto: create-drop  # uygulama başlarken tabloyu oluştur, kapanınca sil
      ddl-auto: update  # tablo yoksa oluştur, varsa güncelle — veriler korunur
    show-sql: true
  h2:
    console:
      enabled: true  # http://localhost:8082/h2-console adresinden veritabanını görebilirsin

  data:
    redis:
      host: localhost
      port: 6379

outbox:
  publisher:
    delay-ms: 1000

cache:
  ttls:
    stock: 60s